<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Scope fallback to HP-OS families; preserve the user's global sans-serif choice. -->
  <alias binding="weak"><family>HarmonyOS Sans</family><accept><family>HarmonyOS Sans SC</family><family>HarmonyOS Sans TC</family><family>Noto Sans CJK SC</family><family>Noto Color Emoji</family></accept></alias>
  <alias binding="weak"><family>HarmonyOS Sans SC</family><accept><family>HarmonyOS Sans TC</family><family>Noto Sans CJK SC</family><family>Noto Color Emoji</family></accept></alias>
</fontconfig>
