name: Omdrop fleet regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fleet-contract:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
      - name: Build fleet and installed-package regression checks
        run: nix shell --inputs-from . nixpkgs#nix-output-monitor nixpkgs#tmux nixpkgs#python3 --command bash tests/omdrop/ci.sh '${{ matrix.system }}'
