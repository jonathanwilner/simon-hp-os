name: Fleet validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fleet-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771
      - name: Evaluate wiring, test launcher, and build changed packages
        run: nix shell --inputs-from . nixpkgs#nix-output-monitor nixpkgs#tmux nixpkgs#python3 --command bash tests/release/ci.sh '${{ matrix.system }}'
      - name: Record exact revision and validation result
        if: always()
        run: |
          test ! -f "$RUNNER_TEMP/fleet-validation-${{ matrix.system }}.json" || cat "$RUNNER_TEMP/fleet-validation-${{ matrix.system }}.json" >> "$GITHUB_STEP_SUMMARY"
          test ! -f "$RUNNER_TEMP/fleet-release-nom/fleet-validation-${{ matrix.system }}.status" || cat "$RUNNER_TEMP/fleet-release-nom/fleet-validation-${{ matrix.system }}.status"
