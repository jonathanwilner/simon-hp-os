<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="od-motion-output" content="interactive"><title>HP-OS · Arrival — Open Design comparison</title><style>
@font-face{font-family:Forma;src:url(assets/HPForma-Regular.ttf)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030914;color:#f4f8fc;font-family:Forma,Arial,sans-serif}#main{width:100vw;height:100vh;position:relative;isolation:isolate;background:#030914}#backdrop{position:absolute;inset:0;background:url(assets/starfield.png) center/cover;opacity:.26}canvas{position:absolute;inset:0;width:100%;height:100%}#brand{position:absolute;left:50%;top:50%;font-size:clamp(68px,8vw,150px);font-weight:400;letter-spacing:-.055em;line-height:1;transform:translate(-50%,-50%);white-space:nowrap}#login{position:absolute;top:43%;left:50%;width:360px;transform:translateX(-50%);text-align:center}#login h1{font-weight:400;font-size:24px;margin:0 0 8px}#login p{font-size:14px;color:#91a6bb;margin:0 0 30px}label{display:block;text-align:left;color:#b8c8d8;font-size:12px;margin-bottom:8px}input{width:100%;height:48px;border:1px solid #5c7388;border-radius:7px;background:#0c1929;color:white;padding:0 15px;font:16px Forma;outline:none}input:focus{border-color:#b9d4ff;box-shadow:0 0 0 2px #024ad844}button{font:15px Forma;color:white;cursor:pointer}#sign{width:100%;height:46px;margin-top:15px;border:0;border-radius:7px;background:#024ad8}#sign:hover{background:#125ee9}#desktop{background:none;border:0;color:#a8bbce;margin-top:24px;font-size:13px}#footer{position:absolute;bottom:34px;left:44px;right:44px;display:flex;justify-content:space-between;align-items:center;color:#7f96ac;font-size:12px}#footer button{border:0;background:none;color:#a8bbce;font-size:12px;padding:8px}#welcome{position:absolute;inset:0;display:grid;place-content:center;font-size:36px;pointer-events:none;opacity:0}#preview{position:absolute;top:23px;right:26px;font:11px Forma;color:#7890a6;letter-spacing:.08em}#accent{height:2px;width:32px;background:#024ad8;margin:0 auto 26px} @media(max-height:650px){#login{top:40%;transform:translateX(-50%) scale(.85);transform-origin:top center}#footer{bottom:12px}}
</style></head><body><main id="main" data-od-id="stage" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080" data-poster-time="3.8"><div id="backdrop"></div><canvas id="stars"></canvas><div id="brand" data-od-id="wordmark">HP-OS</div><section id="login" data-od-id="login"><div id="accent"></div><h1>Welcome back</h1><p>Jonathan</p><label for="password">Password</label><input id="password" type="password" autocomplete="off" placeholder="Enter your password" aria-label="Preview password"><button id="sign">Sign in</button><button id="desktop">HP-OS desktop · Change</button></section><div id="footer"><span>HP-OS</span><div><button id="replay">Replay motion</button><button id="motion">Reduce motion</button><button id="power">Power</button></div></div><div id="welcome">Your workspace is ready</div><div id="preview">DESIGN PREVIEW · SIMULATED LOGIN</div></main><script src="assets/gsap.min.js"></script><script>
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const clock={t:0},tl=gsap.timeline({paused:true});
tl.set('#login',{opacity:0,y:28,scale:1}).set('#footer',{opacity:0}).set('#brand',{opacity:0,scale:.96});
tl.to('#brand',{opacity:1,scale:1,duration:.65,ease:'power2.out'},.1);
tl.to('#brand',{top:'29%',scale:.57,duration:1.1,ease:'power3.inOut'},1.6);
tl.to('#login',{opacity:1,y:0,duration:.65,ease:'power2.out'},2.65);
tl.to('#footer',{opacity:1,duration:.5},3.15);
tl.to(clock,{t:4,duration:4,ease:'none'},0);
window.__timelines={main:tl};
function draw(t,warp=0){const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);let travel=t<1.6?t*.025:.04+Math.min(1.2,t-1.6)*.27;let strength=t>1.6&&t<2.8?Math.sin((t-1.6)/1.2*Math.PI):0;const cx=w*.5,cy=h*.46;for(let i=0;i<120;i++){const a=i*2.399963,r=.04+(i*37%100)/110,z=.15+(((i*.618034-travel-warp)%1+1)%1)*2,x=cx+Math.cos(a)*r*w*.28/z,y=cy+Math.sin(a)*r*w*.28/z,tail=1.005+strength*.08+warp*.12;ctx.beginPath();ctx.strokeStyle=`rgba(190,218,255,${Math.min(.68,.15/z)})`;ctx.lineWidth=Math.max(.5,1/z);ctx.moveTo(x,y);ctx.lineTo(cx+(x-cx)*tail,cy+(y-cy)*tail);ctx.stroke()}}
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;draw(clock.t)}addEventListener('resize',resize);resize();let previewWarp=0;function frame(){draw(clock.t,previewWarp);if(tl.isActive()||previewWarp)requestAnimationFrame(frame)}
window.seek=(t)=>{tl.seek(t,false);draw(t)};window.play=()=>{document.querySelector('#welcome').style.opacity=0;gsap.set('#login',{display:'block'});tl.restart();frame()};document.querySelector('#replay').onclick=window.play;document.querySelector('#motion').onclick=()=>window.seek(4);document.querySelector('#sign').onclick=()=>{document.querySelector('#password').value='';let c={v:0};gsap.to('#login',{opacity:0,scale:1.08,duration:.45});gsap.to(c,{v:.9,duration:.8,onUpdate(){previewWarp=c.v;draw(4,previewWarp)},onComplete(){previewWarp=0;gsap.to('#welcome',{opacity:1,duration:.3})}})};document.querySelector('#password').onkeydown=e=>{if(e.key==='Enter')document.querySelector('#sign').click()};document.querySelector('#desktop').onclick=()=>document.querySelector('#desktop').textContent='Preview only · session stays HP-OS';document.querySelector('#power').onclick=()=>document.querySelector('#power').textContent='Preview only';document.fonts.ready.then(()=>{window.ready=true;if(reduced)seek(4);else play()});
</script></body></html>
